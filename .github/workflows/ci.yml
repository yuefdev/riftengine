name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --locked
