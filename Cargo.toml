[workspace]
resolver = "3"
members = ["crates/core", "crates/rules", "crates/validator", "crates/dll", "crates/host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
windows-sys = "0.61"
embed-resource = "3"
camino = "1"
ltk_hash = "0.5"
ltk_meta = "0.9"
ltk_overlay = "0.19"
ltk_wad = "0.5"
ltk_fantome = "0.17"
ltk_mod_project = "0.18"
zip = "9"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh64"] }
riftengine-core = { path = "crates/core" }
riftengine-rules = { path = "crates/rules" }
riftengine-validator = { path = "crates/validator" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
